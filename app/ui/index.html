<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chain Wallet</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <div><p class="network">F1R3node · secp256k1</p><h1>Public keys</h1></div>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <p id="status" role="status">Loading wallet…</p>
    <ul id="keys" aria-label="Wallet public keys"></ul>
    <nav id="pages" aria-label="Public key pages" hidden>
      <button id="prev" type="button">Previous</button>
      <span id="page"></span>
      <button id="next" type="button">Next</button>
    </nav>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
